name: Bootstrap standalone repository

on:
  issues:
    types:
      - opened

permissions:
  contents: write
  issues: write

jobs:
  bootstrap:
    if: github.event.issue.title == 'bootstrap-standalone-v2'
    runs-on: ubuntu-latest

    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve standalone documentation
        shell: bash
        run: |
          cp README.md /tmp/README.md
          cp NOTICE.md /tmp/NOTICE.md
          cp ACKNOWLEDGEMENTS.md /tmp/ACKNOWLEDGEMENTS.md

      - name: Clone enhanced source branch
        shell: bash
        run: |
          git clone --depth 1 --branch enhanced-audio-v2 https://github.com/Netesfiu/sonic-topography.git /tmp/sonic-source

      - name: Create standalone source snapshot
        shell: bash
        run: |
          set -euo pipefail

          rsync -a --delete --exclude='.git' --exclude='.superpowers' /tmp/sonic-source/ ./

          rm -rf .superpowers
          rm -f CHANGELOG.md HANDOVER.md README_WALLPAPER.md deploy-wallpaper.bat
          rm -f vite.wallpaper.adaptive.config.ts
          rm -f wallpaper/afadian-qrcode.jpg

          cp /tmp/README.md README.md
          cp /tmp/NOTICE.md NOTICE.md
          cp /tmp/ACKNOWLEDGEMENTS.md ACKNOWLEDGEMENTS.md

          sed -i 's/$Branch = "enhanced-audio-v2"/$Branch = "main"/' update.ps1
          sed -i 's/sonic-topography-custom/sonic-topography-extended/g' .env.example

          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.name='sonic-topography-extended'; p.scripts.deploy='powershell -ExecutionPolicy Bypass -File .\\\\update.ps1'; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\\n');"
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('wallpaper/project.json','utf8')); delete p.workshopid; delete p.workshopurl; fs.writeFileSync('wallpaper/project.json', JSON.stringify(p,null,'\\t')+'\\n');"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy standalone Sonic Topography Extended source'
          git push origin HEAD:main

      - name: Close bootstrap issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh issue close "${{ github.event.issue.number }}" --reason completed
