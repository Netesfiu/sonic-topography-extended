name: Bootstrap standalone repository

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.issue.title == 'bootstrap-standalone-repository'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone current extended source
        run: |
          git clone --depth 1 --branch enhanced-audio-v2 https://github.com/Netesfiu/sonic-topography.git /tmp/sonic-source

      - name: Replace target with standalone project
        shell: bash
        run: |
          set -euo pipefail

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/sonic-source/. .
          rm -rf .git

          rm -rf .superpowers
          rm -f HANDOVER.md README_WALLPAPER.md CHANGELOG.md deploy-wallpaper.bat
          rm -f vite.wallpaper.adaptive.config.ts
          rm -f wallpaper/afadian-qrcode.jpg

          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path('update.ps1')
          s = p.read_text(encoding='utf-8')
          s = s.replace('$Branch = "enhanced-audio-v2"', '$Branch = "main"')
          p.write_text(s, encoding='utf-8')

          p = Path('package.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['name'] = 'sonic-topography-extended'
          data['scripts']['deploy'] = 'powershell -ExecutionPolicy Bypass -File .\\update.ps1'
          p.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')

          p = Path('.env.example')
          s = p.read_text(encoding='utf-8')
          s = s.replace('sonic-topography-custom', 'sonic-topography-extended')
          p.write_text(s, encoding='utf-8')

          p = Path('wallpaper/project.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data.pop('workshopid', None)
          data.pop('workshopurl', None)
          p.write_text(json.dumps(data, ensure_ascii=False, indent='\t') + '\n', encoding='utf-8')

          Path('NOTICE.md').write_text('''# Modification and attribution notice

**Sonic Topography Extended** is a modified version of **Sonic Topography** by **CmzYa**.

- Original project: https://github.com/CmzYa/sonic-topography
- Extended version: https://github.com/Netesfiu/sonic-topography-extended
- Extended/modified by: Netesfiu
- Modification notice date: 2026-08-23
- License: GNU General Public License v3.0 (GPL-3.0)

This repository is not presented as an official release by the original author. The complete corresponding source for this modified version is provided here under GPL-3.0.
''', encoding='utf-8')

          Path('README.md').write_text('''# Sonic Topography Extended

![Preview](wallpaper/preview.gif)

A smooth, music-reactive 3D terrain wallpaper for Wallpaper Engine, built with React, Three.js, React Three Fiber and GLSL.

This is a **modified and extended version** of [Sonic Topography](https://github.com/CmzYa/sonic-topography) by **CmzYa**. The extended version retains the original visual concept while substantially expanding audio analysis, temporal smoothing, stereo behavior, terrain dynamics and music-reactive lighting.

> Modification notice: extended by Netesfiu; standalone modified-source release dated 2026-08-23. This repository is not an official release by the original author.

## Features

- True 64-bin stereo-aware analysis from Wallpaper Engine's left/right spectrum channels
- Smooth frame-rate-independent visual attack and release
- Adaptive spectral-flux onset detection
- Tempo estimation and predictive beat tracking
- Beat-synchronized ripple effects
- Stereo spatialization across the terrain
- Multi-timescale spectral memory
- Music-driven terrain coherence
- Music-reactive colored lamp panels
- Lamp positions re-seeded between distinct musical events
- Bass-heavy center exclusion for lamp accents
- Resolution-aware lamp grouping with 120x120 as the calibrated reference
- Configurable lamp trigger, density, brightness and color source
- Meteors and idle-wave effects
- Camera and Wallpaper Engine media controls
- Fine-grained original-layout Wallpaper Engine settings

## Requirements

- Wallpaper Engine
- Node.js
- pnpm (recommended)

## Build

```powershell
pnpm install
pnpm run build
```

The Wallpaper Engine package is generated in `dist-wallpaper/`.

## Local Wallpaper Engine deployment

Copy `.env.example` to `.env`, set `WE` to your local Wallpaper Engine project directory, then run:

```powershell
.\\update.ps1
```

The standalone updater tracks the `main` branch, builds with `vite.wallpaper.lamps.config.ts`, finalizes the Wallpaper Engine settings and deploys the generated files to the configured local project directory.

## Credits

**Original project and visual concept:** CmzYa  
https://github.com/CmzYa/sonic-topography

**Extended version:** Netesfiu  
https://github.com/Netesfiu/sonic-topography-extended

See [NOTICE.md](NOTICE.md) for the modification and attribution notice.

## Support

If you enjoy the extended version and would like to support continued development:

https://ko-fi.com/netesfiu

Support is entirely optional and does not provide or restrict any rights granted by GPL-3.0.

## License

This modified project is distributed under the **GNU General Public License v3.0 (GPL-3.0)**. See [LICENSE](LICENSE).

The complete corresponding source code is available in this repository. Downstream redistribution and modification must comply with GPL-3.0.
''', encoding='utf-8')
          PY

          rm -rf .github

      - name: Commit standalone snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy standalone Sonic Topography Extended"
          git push origin HEAD:main
