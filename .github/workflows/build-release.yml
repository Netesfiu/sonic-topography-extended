name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Wallpaper Engine package
        run: pnpm run build

      - name: Verify build output
        shell: bash
        run: |
          test -f dist-wallpaper/index.html
          test -f dist-wallpaper/project.json
          test -f dist-wallpaper/preview.gif

      - name: Create release archive
        shell: bash
        run: |
          ref_name="${GITHUB_REF_NAME//\//-}"
          archive="sonic-topography-extended-${ref_name}.zip"
          (cd dist-wallpaper && zip -r "../${archive}" .)
          echo "RELEASE_ARCHIVE=${archive}" >> "$GITHUB_ENV"

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonic-topography-extended-${{ github.sha }}
          path: dist-wallpaper/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.RELEASE_ARCHIVE }}
          generate_release_notes: true
