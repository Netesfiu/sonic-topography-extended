name: Complete Standalone Migration

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/complete-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone working enhanced source
        run: git clone --depth 1 --branch enhanced-audio-v2 https://github.com/Netesfiu/sonic-topography.git /tmp/sonic-source

      - name: Copy standalone source tree
        shell: bash
        run: |
          set -euo pipefail

          rm -rf src wallpaper scripts
          cp -a /tmp/sonic-source/src ./src
          cp -a /tmp/sonic-source/wallpaper ./wallpaper
          cp -a /tmp/sonic-source/scripts ./scripts

          cp /tmp/sonic-source/LICENSE ./LICENSE
          cp /tmp/sonic-source/package.json ./package.json
          cp /tmp/sonic-source/pnpm-lock.yaml ./pnpm-lock.yaml
          cp /tmp/sonic-source/tsconfig.json ./tsconfig.json
          cp /tmp/sonic-source/update.ps1 ./update.ps1
          cp /tmp/sonic-source/vite.wallpaper.config.ts ./vite.wallpaper.config.ts
          cp /tmp/sonic-source/vite.wallpaper.lamps.config.ts ./vite.wallpaper.lamps.config.ts

          rm -f wallpaper/afadian-qrcode.jpg

          sed -i 's/\$Branch = "enhanced-audio-v2"/\$Branch = "main"/' update.ps1
          sed -i 's/sonic-topography-custom/sonic-topography-extended/g' .env.example

          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.name='sonic-topography-extended'; p.scripts.deploy='powershell -ExecutionPolicy Bypass -File .\\update.ps1'; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');"
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('wallpaper/project.json','utf8')); delete p.workshopid; delete p.workshopurl; fs.writeFileSync('wallpaper/project.json', JSON.stringify(p,null,'\t')+'\n');"

          rm -f .github/workflows/complete-migration.yml

      - name: Commit completed standalone tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes required."
            exit 0
          fi
          git commit -m "Complete standalone Sonic Topography Extended repository"
          git push origin HEAD:main
